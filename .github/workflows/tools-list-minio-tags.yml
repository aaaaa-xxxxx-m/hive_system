name: tools-list-minio-tags

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Probe MinIO + S3-compatible images
        run: |
          probe() {
            if timeout 200 docker pull -q "$1" >/tmp/p.log 2>&1; then
              echo "PULL_OK  $1"
            else
              echo "PULL_NO  $1 :: $(tail -1 /tmp/p.log | cut -c1-160)"
            fi
          }
          probe minio/minio:latest
          probe quay.io/minio/minio:latest
          probe seaweedfs/seaweedfs:latest
          probe chrislusf/seaweedfs:latest
          probe zenko/cloudserver:latest
          probe opendatacube/minio:latest
