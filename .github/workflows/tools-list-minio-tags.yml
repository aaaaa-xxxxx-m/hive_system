name: tools-list-minio-tags

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Probe MinIO mirrors
        run: |
          probe() {
            if timeout 200 docker pull -q "$1" >/tmp/p.log 2>&1; then echo "PULL_OK  $1"; else echo "PULL_NO  $1 :: $(tail -1 /tmp/p.log | cut -c1-120)"; fi
          }
          probe bitnamilegacy/minio:latest
          probe coollabsio/minio:latest
          probe ghcr.io/coollabsio/minio:latest
          probe minio/minio:RELEASE.2022-10-15T19-57-03Z
          probe chrislusf/seaweedfs:latest
          probe zenko/cloudserver:latest
