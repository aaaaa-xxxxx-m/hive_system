name: tools-list-minio-tags

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Probe MinIO image sources
        run: |
          for ref in \
            minio/minio:latest \
            minio/minio:RELEASE.2025-04-22T22-12-26Z \
            minio/minio:RELEASE.2025-03-12T18-04-18Z \
            minio/minio:RELEASE.2024-12-18T13-15-44Z \
            minio/minio:RELEASE.2024-11-07T00-52-20Z \
            bitnami/minio:latest \
            quay.io/minio/minio:latest \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z ; do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then echo "OK   $ref"; else echo "NO   $ref"; fi
          done
          echo "===== token+tags (verbose) ====="
          curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:minio/minio:pull" | head -c 200
          echo
