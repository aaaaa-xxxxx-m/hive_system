<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜂群在线监测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #F5F5F5;
            color: #333;
            background-image: url('https://img0.baidu.com/it/u=3911190909,1209119090&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=600');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header {
            background-color: #2E7D32;
            color: white;
            padding: 18px 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            background-image: url('https://img2.baidu.com/it/u=1234567890,987654321&fm=253&fmt=auto&app=120&f=JPEG?w=500&h=100');
            background-size: cover;
            background-position: center;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title img {
            width: 32px;
            height: 32px;
        }
        .main {
            padding: 40px 0;
        }

        /* 温湿度展示 */
        .data-card {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .item {
            width: 30%;
            min-width: 200px;
            padding: 20px;
            background: #F1F8E9;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(46,125,50,0.15);
        }
        .item img {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
        }
        .label {
            font-size: 18px;
            color: #2E7D32;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .value {
            font-size: 36px;
            font-weight: bold;
            color: #2E7D32;
        }
        .time {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        /* 失王状态 */
        .queen-status {
            background: rgba(255,255,255,0.95);
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .queen-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .queen-header img {
            width: 56px;
            height: 56px;
        }
        .queen-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .queen-result {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        .normal { color: #2E7D32; }
        .lost { color: #c62828; }
        .loading { color: #666; }
        .queen-msg {
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
        }

        /* 结果详情框 */
        .result-detail {
            background: #F8F9FA;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            display: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .result-detail.active {
            display: block;
        }
        .detail-title {
            font-size: 18px;
            font-weight: bold;
            color: #2E7D32;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-item {
            font-size: 16px;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .detail-item strong {
            color: #333;
            min-width: 100px;
            display: inline-block;
        }

        /* 按钮区域（新增模型更新按钮） */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 40px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(46,125,50,0.3);
            transition: all 0.3s;
        }
        .btn:hover {
            background: #1B5E20;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .btn-update {
            background: #1976D2; /* 模型更新按钮用蓝色区分 */
        }
        .btn-update:hover {
            background: #0D47A1;
        }

        /* 模型更新状态提示 */
        .model-update-status {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none;
        }
        .model-update-status.active {
            display: block;
        }
        .status-title {
            font-size: 20px;
            font-weight: bold;
            color: #2E7D32;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-content {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }
        .status-success {
            color: #2E7D32;
        }
        .status-error {
            color: #c62828;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .item {
                width: 100%;
            }
            .queen-result {
                font-size: 36px;
            }
            .result-detail {
                padding: 15px;
            }
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    
    <div class="header">
        <div class="container header-content">
            <div class="header-title">
                🐝 蜂群在线监测系统
            </div>
            <div id="deviceID" style="font-size: 18px;"></div>
            <div style="font-size: 18px;">实时环境与蜂王状态监测</div>
        </div>
    </div>

    <div class="main container">
        <!-- 温湿度展示 -->
        <div class="data-card">
            <div class="item">
                <div class="label">当前温度</div>
                <div class="value" id="temp">--</div>
                <div class="time" id="temp_time">更新时间：--</div>
            </div>
            <div class="item">
                <div class="label">当前湿度</div>
                <div class="value" id="humi">--</div>
                <div class="time" id="humi_time">更新时间：--</div>
            </div>
            <div class="item">
                <div class="label">环境状态</div>
                <div class="value" id="env_status">--</div>
                <div class="time" id="env_tip">加载中...</div>
            </div>
        </div>

        <!-- 失王状态检测 -->
        <div class="queen-status">
            <div class="queen-header">
                <div class="queen-title">蜂王状态</div>
            </div>
            <div id="queen_result" class="queen-result loading">等待结果...</div>
            <div id="queen_msg" class="queen-msg"></div>
        </div>

        <!-- 按钮组（模型更新） -->
        <div class="btn-group">
            <button id="updateModelBtn" class="btn btn-update">更新检测模型</button>
        </div>

        <!-- 模型更新状态提示框 -->
        <div class="model-update-status" id="modelUpdateStatus">
            <div class="status-title">🔄 模型更新状态</div>
            <div class="status-content" id="updateStatusContent">
                正在更新模型...
            </div>
        </div>

    </div>
    <script src="./detailJs.js"></script>
</body>
</html>
