services:
  # ========== 反向代理 ==========
  nginx:
    image: ghcr.io/aaaaa-xxxxx-m/hive_system/nginx:1.25-alpine
    container_name: bee-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./app/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - minio
    networks:
      - bee-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # ========== 后端 API (FastAPI) ==========
  backend:
    image: ghcr.io/aaaaa-xxxxx-m/hive_system/bee-backend:latest
    container_name: bee-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=audio
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - MINIO_PUBLIC_SECURE=false
      - MODEL_SIGNING_PUBLIC_KEY=${MODEL_SIGNING_PUBLIC_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_SALT=${API_KEY_SALT}
      - LOG_LEVEL=INFO
    volumes:
      - ./data/models:/app/models:ro
      - ./logs/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bee-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ========== Celery Worker (异步任务) ==========
  celery-worker:
    image: ghcr.io/aaaaa-xxxxx-m/hive_system/bee-backend:latest
    container_name: bee-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --pool=solo --concurrency=1 -Q training,inference,cleanup
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=audio
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - MINIO_PUBLIC_SECURE=false
      - MODEL_SIGNING_PRIVATE_KEY=${MODEL_SIGNING_PRIVATE_KEY}
      - MODEL_SIGNING_PUBLIC_KEY=${MODEL_SIGNING_PUBLIC_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./data/models:/app/models
      - ./logs/celery:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bee-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ========== Celery Beat (定时任务) ==========
  celery-beat:
    image: ghcr.io/aaaaa-xxxxx-m/hive_system/bee-backend:latest
    container_name: bee-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=INFO --scheduler redbeat.RedBeatScheduler
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=audio
      - MODEL_SIGNING_PRIVATE_KEY=${MODEL_SIGNING_PRIVATE_KEY}
      - MODEL_SIGNING_PUBLIC_KEY=${MODEL_SIGNING_PUBLIC_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./logs/celery:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bee-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ========== MySQL 8.0 ==========
  mysql:
    image: ghcr.io/aaaaa-xxxxx-m/hive_system/mysql:8.0
    container_name: bee-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-file-size=64M
      - --max-connections=100
      - --slow-query-log=1
      - --slow-query-log-file=/var/log/mysql/slow.log
      - --long-query-time=2
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./logs/mysql:/var/log/mysql
    networks:
      - bee-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 640M
        reservations:
          cpus: '0.1'
          memory: 256M

  # ========== Redis 7 ==========
  redis:
    image: ghcr.io/aaaaa-xxxxx-m/hive_system/redis:7-alpine
    container_name: bee-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes --save 60 1000
    volumes:
      - ./data/redis:/data
      - ./logs/redis:/var/log/redis
    networks:
      - bee-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ========== MinIO 对象存储 ==========
  minio:
    image: ghcr.io/aaaaa-xxxxx-m/hive_system/minio:latest
    container_name: bee-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
      - ./logs/minio:/var/log/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - bee-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  bee-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
