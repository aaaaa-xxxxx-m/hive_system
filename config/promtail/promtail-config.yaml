server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400
    timeout: 10s

scrape_configs:
  # 后端应用日志 (JSON 格式)
  - job_name: bee-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          service: bee-monitor
          environment: production
          __path__: /var/log/bee-monitor/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            trace_id: trace_id
            device_id: device_id
            msg: msg
            logger: logger
      - labels:
          level:
          trace_id:
          device_id:
          logger:
      - timestamp:
          source: time
          format: RFC3339

  # Celery Worker 日志
  - job_name: bee-celery
    static_configs:
      - targets:
          - localhost
        labels:
          job: celery
          service: bee-monitor
          environment: production
          __path__: /var/log/bee-monitor/celery/*.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            trace_id: trace_id
            task_id: task_id
            task_name: task_name
            msg: msg
      - labels:
          level:
          trace_id:
          task_id:
          task_name:
      - timestamp:
          source: time
          format: RFC3339

  # Nginx 访问日志 (JSON 格式)
  - job_name: bee-nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          type: access
          service: bee-monitor
          environment: production
          __path__: /var/log/bee-monitor/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            remote_addr: remote_addr
            request: request
            status: status
            body_bytes_sent: body_bytes_sent
            request_time: request_time
            upstream_response_time: upstream_response_time
            http_referrer: http_referrer
            http_user_agent: http_user_agent
            http_x_forwarded_for: http_x_forwarded_for
            trace_id: trace_id
      - labels:
          status:
          trace_id:
      - timestamp:
          source: time
          format: RFC3339
      - metrics:
          request_duration:
            type: Histogram
            source: request_time
            buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
          upstream_duration:
            type: Histogram
            source: upstream_response_time
            buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
          response_size:
            type: Histogram
            source: body_bytes_sent
            buckets: [100, 1000, 10000, 100000, 1000000, 10000000]

  # Nginx 错误日志
  - job_name: bee-nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          type: error
          service: bee-monitor
          environment: production
          __path__: /var/log/bee-monitor/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<msg>.*)$'
      - labels:
          level:
      - timestamp:
          source: time
          format: '2006/01/02 15:04:05'

  # MySQL 慢查询日志
  - job_name: bee-mysql-slow
    static_configs:
      - targets:
          - localhost
        labels:
          job: mysql
          type: slowlog
          service: bee-monitor
          environment: production
          __path__: /var/log/bee-monitor/mysql/slow.log
    pipeline_stages:
      - regex:
          expression: '^# Time: (?P<time>.*)$'
      - regex:
          expression: '^# User@Host: (?P<user>.*)$'
      - regex:
          expression: '^# Query_time: (?P<query_time>[\d.]+) Lock_time: (?P<lock_time>[\d.]+) Rows_sent: (?P<rows_sent>\d+) Rows_examined: (?P<rows_examined>\d+)$'
      - regex:
          expression: '^(?P<query>SET|SELECT|INSERT|UPDATE|DELETE|COMMIT|ROLLBACK).*'
      - labels:
          user:
      - timestamp:
          source: time
          format: '2006-01-02T15:04:05.000000Z'

  # 宿主机系统日志
  - job_name: host-system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          service: bee-monitor
          environment: production
          __path__: /var/log/host/**/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<time>\w{3}\s+\d+\s+\d+:\d+:\d+) (?P<host>\S+) (?P<service>\S+)(?:\[(?P<pid>\d+)\])?: (?P<msg>.*)$'
      - labels:
          host:
          service:
          pid:
      - timestamp:
          source: time
          format: 'Jan  2 15:04:05'